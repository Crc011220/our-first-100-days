<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5ead8" />
    <title>我们的一百天</title>
    <link rel="icon" type="image/png" href="assets/icons/memory-icon.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="timeline.css" />
  </head>
  <body>
    <audio id="bgm" loop preload="metadata" src="assets/audio/the-hundredth-day.mp3"></audio>
    <main>
      <section class="hero">
        <div class="grain"></div>
        <button class="music" id="musicButton" aria-label="播放背景音乐">♪ <span>第几个一百天</span></button>
        <p class="eyebrow">OUR FIRST 100 DAYS</p>
        <h1>写给我们<br /><em>第一个一百天</em></h1>
        <p class="hero-copy">不是每一天都闪闪发光，<br />但和你在一起的每一天，都值得被珍藏。</p>
        <a href="#memories" class="down" aria-label="查看回忆">↓</a>
      </section>

      <section class="milestones" aria-labelledby="milestones-title">
        <p class="eyebrow">APR 18 — JUL 26 · 100 DAYS</p>
        <h2 id="milestones-title">每一步都有回声。</h2>
        <p class="milestone-lead">从第 2 天的迪士尼，到第 100 天的现在。<br />这些被认真记下的瞬间，拼成了我们。</p>
        <ol class="milestone-list" id="milestoneTimeline" aria-label="我们的百日时间轴"></ol>
        <div class="day-hundred"><span>DAY 100</span><b>♥</b><p>还在继续</p></div>
      </section>

      <section class="timeline" id="gallery" aria-label="我们的回忆时间线"></section>

      <section class="letter">
        <p class="eyebrow">A LITTLE PROMISE</p><h2>希望我们 <br />能有很多很多个一百天</h2>
        <button id="promiseButton">点一下，收下我的心意 <b>♥</b></button>
        <p class="secret" id="secret">愿我们一直有话说、有处去、有彼此。<br />第 101 天开始，也继续把平凡的日子过成故事吧。</p>
      </section>
      <footer>to 萱萱 · made by 尘尘网</footer>
    </main>
    <dialog id="memoryDialog">
      <button class="close" aria-label="关闭">×</button><div id="dialogContent"></div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
<script src="script.js?v=100days-photo-fix-1"></script>
  </body>
</html>
